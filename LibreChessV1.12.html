        :root {

            --sq-highlight: rgba(245, 246, 130, 0.72);

            user-select: none;
        }

        }
        ::-webkit-scrollbar-track {
            background: #1a1917;
        }
        ::-webkit-scrollbar-thumb {
            background: #3d3a35;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #524e47;
        }

            position: relative;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65);
        }
